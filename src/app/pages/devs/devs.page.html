<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/pokemon-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Desenvolvedores</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card *ngFor="let aluno of devs">
    <ion-card-header>
      <ion-card-title>{{aluno.nome}}</ion-card-title>
      <ion-card-subtitle>{{aluno.matricula}}</ion-card-subtitle>
    </ion-card-header> 
    <ion-card-content>
      <img alt="Foto do aluno" [src]="aluno.foto" />
    </ion-card-content>
  </ion-card>
</ion-content>
