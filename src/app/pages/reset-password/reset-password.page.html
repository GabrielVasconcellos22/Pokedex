
<ion-content [fullscreen]="true">
  <div class="header">
    <ion-title class="title">
      Digite seu e-mail
      <p class="subTitle">Para redefinir sua senha</p>
    </ion-title>
  </div>
  <div class="ion-padding">
    <ion-item>
      <ion-input type="email" [(ngModel)]="email" class="input" placeholder="Digite seu e-mail"></ion-input>
      <ion-icon name="mail-outline"></ion-icon>
    </ion-item>
    <ion-fab>
      <ion-fab-button [routerLink]="['/login']">
        <ion-icon name="chevron-back"></ion-icon>     
      </ion-fab-button>
    </ion-fab>
    <ion-fab vertical="botton" horizontal="end">
      <ion-fab-button (click)="resetPassword()">
        <ion-icon name="chevron-forward"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </div>
</ion-content>
